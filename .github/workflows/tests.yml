# Checks that every reference solution passes its tests and that the website
# builds. Students' stubs are expected to fail, so CI runs the "solutions" profile.
name: Verify solutions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile exercises (stubs must compile)
        run: mvn -B -q test-compile
      - name: Run all tests against the solutions
        run: mvn -B test -Psolutions

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - name: Build the website (fails on broken links)
        run: mkdocs build --strict
